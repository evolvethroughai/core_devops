trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Security_Lint
    displayName: "Security & Code Linting"
    jobs:
      - job: Lint
        steps:
          - checkout: self
          - script: |
              sudo apt-get update && sudo apt-get install -y curl unzip
              curl -sSLo tflint.zip https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
              unzip -o tflint.zip
              sudo mv tflint /usr/local/bin/
              rm tflint.zip
              tflint --version
              tflint --chdir=environments/uat
            displayName: "Run TFLint"

          - script: |
              pip install checkov
              checkov -d environments/uat --framework terraform --soft-fail
            displayName: "Run Checkov"

  - stage: Terraform_Plan
    displayName: "Terraform Plan Stage"
    dependsOn: Security_Lint
    jobs:
      - job: Plan
        steps:
          - checkout: self
          - script: |
              sudo apt-get update && sudo apt-get install -y curl unzip
              curl -sSLo terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
              sudo unzip -o terraform.zip -d /usr/local/bin/
              rm terraform.zip
              terraform --version
            displayName: "Install Terraform Binary"

          - task: AzureCLI@2
            displayName: "Terraform Init & Plan"
            inputs:
              azureSubscription: "azure-oidc-service-connection"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              workingDirectory: "$(Build.SourcesDirectory)/environments/uat"
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -reconfigure -backend-config=backend.hcl
                terraform plan -out=tfplan

          - publish: $(Build.SourcesDirectory)/environments/uat/tfplan
            artifact: tfplan
            displayName: "Publish Plan Artifact"

  - stage: Terraform_Apply
    displayName: "Terraform Apply Stage"
    dependsOn: Terraform_Plan
    jobs:
      - deployment: Apply
        displayName: "Terraform Apply to UAT"
        environment: "uat"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - script: |
                    sudo apt-get update && sudo apt-get install -y curl unzip
                    curl -sSLo terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
                    sudo unzip -o terraform.zip -d /usr/local/bin/
                    rm terraform.zip
                  displayName: "Install Terraform Binary"
                - task: AzureCLI@2
                  displayName: "Terraform Apply"
                  inputs:
                    azureSubscription: "azure-oidc-service-connection"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    addSpnToEnvironment: true
                    workingDirectory: "$(Build.SourcesDirectory)/environments/uat"
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_OIDC_TOKEN=$idToken
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      terraform init -reconfigure -backend-config=backend.hcl
                      terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
