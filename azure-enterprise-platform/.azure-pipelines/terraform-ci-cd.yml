trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Terraform_Plan
    displayName: "Terraform Plan Stage"
    jobs:
      - job: Plan
        displayName: "Terraform Init & Plan"
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: "azure-oidc-service-connection"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                cd environments/dev
                terraform init
                terraform plan -out=tfplan
          - publish: environments/dev/tfplan
            artifact: tfplan

  - stage: Terraform_Apply
    displayName: "Terraform Apply Stage"
    dependsOn: Terraform_Plan
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: "dev"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: tfplan
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: "azure-oidc-service-connection"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      cd environments/dev
                      terraform init
                      terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
